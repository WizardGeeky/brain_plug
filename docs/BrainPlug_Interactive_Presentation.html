<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainPlug — Enterprise AI Platform Architecture & Presentation Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --card-border: #1e293b;
      --primary: #8b5cf6;
      --primary-light: #c4b5fd;
      --primary-glow: rgba(139, 92, 246, 0.15);
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-body: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient Glow */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, rgba(6, 182, 212, 0.05) 50%, transparent 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header Nav */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .brand span {
      background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn:hover {
      border-color: var(--primary);
      background: var(--primary-glow);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #6d28d9);
      border: none;
      color: white;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
      transform: translateY(-1px);
    }

    /* Slide Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1100px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 40px;
      min-height: 580px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary-light);
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .slide-title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .slide-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Grid Layouts inside slides */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .card-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.2s;
    }

    .card-box:hover {
      border-color: rgba(139, 92, 246, 0.4);
    }

    .card-box h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-box p, .card-box li {
      font-size: 0.88rem;
      color: var(--text-body);
      line-height: 1.5;
    }

    .card-box ul {
      list-style-type: none;
      padding-left: 0;
    }

    .card-box li {
      margin-bottom: 8px;
      position: relative;
      padding-left: 18px;
    }

    .card-box li::before {
      content: "•";
      color: var(--primary);
      font-weight: bold;
      position: absolute;
      left: 0;
      font-size: 1.1rem;
      line-height: 1;
    }

    /* Code Snippets */
    pre, code {
      font-family: 'JetBrains Mono', monospace;
    }

    pre {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      font-size: 0.82rem;
      color: var(--text-body);
      overflow-x: auto;
      line-height: 1.6;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      background: #1e293b;
      color: var(--text);
      font-weight: 700;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 2px solid var(--card-border);
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-body);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Metric Cards */
    .metric-value {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--accent-cyan);
      margin: 4px 0;
    }

    /* Slide Navigation Footer */
    .slide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .slide-progress {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--card-border);
      cursor: pointer;
      transition: all 0.2s;
    }

    .dot.active {
      width: 24px;
      border-radius: 4px;
      background: var(--primary);
    }

    @media (max-width: 768px) {
      .grid-2, .grid-3, .grid-4 {
        grid-template-columns: 1fr;
      }
      .slide-wrapper {
        padding: 20px;
      }
    }
  </style>
</head>

    let currentSlide = 0;

    function renderSlide(index) {
      const slide = slides[index];
      const container = document.getElementById("slide-container");
      container.innerHTML = `
        <div>
          <div class="slide-header">
            <span class="badge">${slide.badge}</span>
            <h1 class="slide-title">${slide.title}</h1>
            <p class="slide-subtitle">${slide.subtitle}</p>
          </div>
          <div class="slide-body">
            ${slide.content}
          </div>
        </div>
        <div class="slide-footer">
          <span>BrainPlug Enterprise AI Platform Architecture</span>
          <div class="slide-progress">
            ${slides.map((_, i) => `<div class="dot ${i === index ? 'active' : ''}" onclick="goToSlide(${i})"></div>`).join('')}
          </div>
          <span>Slide ${index + 1} of ${slides.length}</span>
        </div>
      `;

      document.getElementById("slide-counter").innerText = `Slide ${index + 1} / ${slides.length}`;
      document.getElementById("prev-btn").disabled = index === 0;
      document.getElementById("next-btn").disabled = index === slides.length - 1;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
    }

    // Keyboard Navigation
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "Space") {
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        prevSlide();
      }
    });

    renderSlide(0);
  </script>
